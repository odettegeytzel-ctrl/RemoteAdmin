# Nginx delante de RemoteAdmin.
#
# Destino: /etc/nginx/sites-available/remoteadmin
#   sudo ln -s /etc/nginx/sites-available/remoteadmin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El TLS publico lo pone Cloudflare; aqui se escucha en claro sobre
# loopback porque el unico que llega hasta aqui es cloudflared, desde
# la propia maquina.

server {

    listen 127.0.0.1:80;
    server_name _;

    # Las grabaciones que se archivan en el servidor pueden pesar. El
    # valor por defecto (1 MB) las rechazaria con un 413.
    client_max_body_size 512M;

    location / {

        proxy_pass http://127.0.0.1:8000;

        # --- WebSocket ---
        #
        # Estas dos lineas son las que hacen que /ws/agent funcione.
        # Sin ellas el panel carga perfectamente y ningun Agent
        # conecta nunca: es el fallo mas comun de esta configuracion y
        # el que mas cuesta encontrar, porque no da ningun error
        # visible en el navegador.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # La conexion de un Agent esta abierta y callada entre latidos.
        # Con el timeout por defecto (60s) se cortaria sin parar y los
        # equipos parecerian desconectarse solos.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # El panel transmite pantalla en vivo: con buffer se ve a
        # tirones y con retraso.
        proxy_buffering off;
    }
}
